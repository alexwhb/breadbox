id = "buttons-pullups"
track = "electricity"
order = 7
title = "Buttons & pull-ups"
summary = "A button alone doesn't make a voltage. A pull-up resistor does: 5 V when released, 0 V when pressed."
minutes = 8

[bench]
project = "buttons-pullups.bench.json"

[[steps]]
kind = "explain"
title = "A node needs a definite level"
body = """
A push button only connects or disconnects. To turn it into a clean signal, a **pull-up resistor** holds the node at 5 V while the button is open. Pressing the button connects the node straight to GND, which wins easily over the 10 kΩ.

Microcontroller inputs read exactly this: HIGH when released, LOW when pressed."""

[[steps.callouts]]
part = "r1"
title = "Pull-up"
text = "holds the node at 5 V until the button pulls it to GND"

[[steps]]
kind = "measure"
title = "Released: pulled up"
body = "With nothing pressed, almost no current flows through R1, so there is almost no voltage across it. The node sits at the full 5 V."
checks = [{ type = "reading", part = "dmm1", key = "value", min = 4.9, max = 5.05 }]
solution = [{ do = "run", seconds = 0.5 }]

[steps.measure]
part = "dmm1"
unit = "V"

[[steps]]
kind = "measure"
title = "Pressed: pulled down"
body = "Hold the button down. The node is now wired to GND; R1 has all 5 V across it."
checks = [{ type = "reading", part = "dmm1", key = "value", min = -0.05, max = 0.1 }]
solution = [
    { do = "press", part = "sw1", on = true },
    { do = "run", seconds = 0.5 },
]

[steps.measure]
part = "dmm1"
unit = "V"

[[steps]]
kind = "predict"
title = "The price of a pull-up"
body = "While the button is held, current flows from 5 V through R1 into GND."
checks = [{ type = "prediction" }]
solution = [
    { do = "predict" },
    { do = "press", part = "sw1", on = false },
]

[steps.vars]
R = 10000.0

[steps.predict]
prompt = "How much current flows through the 10 kΩ pull-up while the button is pressed?"
unit = "mA"
answer = "5 / R * 1000"
correct_text = "Right: 5 V ÷ 10 kΩ = {answer:g} mA, small enough to waste almost nothing."
default_hint = "All 5 V sit across R1: I = 5 V ÷ 10 000 Ω, then × 1000 for mA."
working = ["I = 5 V ÷ 10 000 Ω", "I = 0.0005 A = 0.5 mA"]

[[steps.predict.hints]]
when = "abs(guess - 5 / R) <= 0.05 * 5 / R"
text = "Right number, wrong unit: that’s amps. Multiply by 1000 to get mA."

[[steps]]
kind = "quiz"
title = "Why 10 kΩ?"

[steps.quiz]
question = "Why not use a 100 Ω pull-up instead of 10 kΩ?"
options = [
    "The button wouldn't work at all",
    "It would draw 50 mA every time you press, wasting power and heating the resistor",
    "The node would sit at 0 V when released",
    "100 Ω resistors don't exist",
]
answer = 1
explain = "5 V ÷ 100 Ω = 50 mA while pressed. A pull-up only has to win against a tiny input current, so a large value does the job for almost free."

[[steps.solution]]
do = "quiz"
answer = 1
