id = "ble-button"
track = "radios"
order = 1
title = "Bluetooth: a button on your phone"
summary = "An UNO with an HM-10 BLE module sends button presses to the virtual phone, and takes commands back."
minutes = 12

[bench]
project = "ble-button.bench.json"

[[steps]]
kind = "explain"
title = "A serial cable without the cable"
body = """
The HM-10 is a Bluetooth Low Energy module that behaves like a wireless serial port: bytes the UNO writes to it (through `SoftwareSerial` on D10/D11) arrive on a connected phone, and the other way round.

Before a phone connects, the UNO configures it with **AT commands**: a name to advertise and connection notifications. The two resistors divide the UNO's 5 V TX down to the module's 3.3 V input."""

[[steps.callouts]]
part = "u2"
title = "U2 HM-10"
text = "BLE: advertises as “bb-button”"

[[steps]]
kind = "measure"
title = "Power up"
hints = [
    "Nothing to do: give the UNO a couple of seconds.",
    "The sketch sets up the HM-10 with AT commands first.",
]
why = "At start-up the sketch names the module with AT commands, and the module answers OK."
success = "Ready"
body = "Run the bench. In the **Serial** box the sketch sends its AT commands and reports **ble-button ready**."
checks = [
    { type = "serial_contains", mcu = "u1", text = "AT+NAMEbb-button -> OK" },
    { type = "serial_contains", mcu = "u1", text = "ble-button ready" },
]
solution = [{ do = "run", seconds = 2.0 }]

[[steps]]
kind = "experiment"
title = "Connect the phone"
hints = [
    "Press Connect phone in the controls.",
    "Then press Open terminal.",
]
why = "Once connected, the HM-10 passes serial data over Bluetooth both ways: a serial cable without the cable."
success = "Connected"
body = "Press **Connect phone**: the virtual phone scans and connects to **bb-button**, and the module tells the UNO `OK+CONN`. Then press **Open terminal** to see what the UNO sends."
checks = [{ type = "serial_contains", mcu = "u1", text = "phone connected" }]
solution = [
    { do = "phone_connect", name = "bb-button" },
    { do = "run", seconds = 1.0 },
    { do = "phone_terminal" },
    { do = "run", seconds = 0.3 },
]

[[steps]]
kind = "experiment"
title = "Press the button"
hints = [
    "Click and hold SW1 on the breadboard, then let go.",
    "Watch the Serial box: “pressed #1”.",
]
why = "The sketch counts the press and, since a phone is connected, writes it to the HM-10, which sends it over the air."
success = "Sent"
body = "Press SW1. The sketch counts the press and, because a phone is connected, sends it over the air."
checks = [
    { type = "serial_contains", mcu = "u1", text = "pressed #1" },
    { type = "phone", contains = "pressed #1" },
]
solution = [
    { do = "press", part = "sw1", on = true },
    { do = "run", seconds = 0.2 },
    { do = "press", part = "sw1", on = false },
    { do = "run", seconds = 0.5 },
]

[[steps]]
kind = "experiment"
title = "Talk back"
hints = [
    "Type ? into the phone message field.",
    "Press Send; the answer shows up in the phone's terminal.",
]
why = "The HM-10 hands the phone's ? to the UNO's serial port, and the sketch answers with its press count."
success = "Talked back"
body = "Type `?` into the **Phone message** field and press **Send**. The sketch answers with its press count."
checks = [{ type = "phone", contains = "presses=1" }]
solution = [
    { do = "phone_send", text = "?\n" },
    { do = "run", seconds = 1.0 },
]

[[steps]]
kind = "quiz"
title = "Range"

[steps.quiz]
question = "Why does the UNO only send the press when `connected` is true?"
options = [
    "BLE can't transmit at all without a connection",
    "Bytes written with no phone connected would be taken as AT commands by the HM-10",
    "To save the button",
    "The UNO can't count while disconnected",
]
answer = 1
explain = "While disconnected, the HM-10 is in command mode: anything starting with AT is a command, and stray text is ignored or misread."

[[steps.solution]]
do = "quiz"
answer = 1
