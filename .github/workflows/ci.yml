name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pinned so a new stable release can't break CI with fresh clippy lints; bump deliberately
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  check:
    name: fmt · clippy · tests (macOS, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Engine, plugin, lesson and end-to-end tests
        # arduino-cli / ngspice aren't installed here: tests that need them skip with a message
        # and use the committed prebuilt firmware / golden data instead.
        run: cargo test --workspace --exclude breadbox
      - name: App unit tests
        # the GUI suites render with wgpu and run locally via scripts/test-all.sh
        run: cargo test -p breadbox --lib
