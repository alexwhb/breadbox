<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Breadbox app icon: the logo mark from docs/design/source/1-workbench.html (a dark tile
       with an amber border, three amber header pins and a blue jumper wire) on the macOS icon
       grid (824 px body, 100 px margin). Rendered by the app_icon example of the breadbox crate. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC3F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4CC3F0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="holes" x="100" y="100" width="58.86" height="58.86" patternUnits="userSpaceOnUse">
      <rect x="25" y="25" width="9" height="9" rx="2" fill="#000000" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- the tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#holes)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="124" y="124" width="776" height="776" rx="164" fill="none" stroke="#F2A33A" stroke-width="40"/>

  <!-- the mark (26-unit logo space → the tile) -->
  <g transform="translate(65.67 65.67) scale(34.333)">
    <circle cx="18" cy="18" r="4.2" fill="url(#glow)"/>
    <circle cx="8" cy="9" r="1.75" fill="#F2A33A"/>
    <circle cx="13" cy="9" r="1.75" fill="#F2A33A"/>
    <circle cx="18" cy="9" r="1.75" fill="#F2A33A"/>
    <path d="M8 9 C8 18 18 12 18 18" fill="none" stroke="#4CC3F0" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="18" cy="18" r="1.75" fill="#4CC3F0"/>
  </g>
</svg>
