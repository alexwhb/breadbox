[package]
name = "bb-plugin-sdk"
description = "Guest-side SDK for writing Breadbox plugins in Rust, compiled to wasm32-unknown-unknown."
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
dlmalloc = { version = "0.2", features = ["global"], optional = true }

[features]
default = []
# For `#![no_std]` plugins: installs dlmalloc as the global allocator.
global-allocator = ["dep:dlmalloc"]
